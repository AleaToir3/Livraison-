# Construit l'APK Android de l'app et le publie sur la page « Releases » (lien permanent « android-latest »).
# Se lance à chaque push qui touche mobile/, ou à la main : onglet Actions > « Android APK » > Run workflow.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/uk-delivery-route-optimizer-ginh31]
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write # nécessaire pour publier la release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances JavaScript
        run: npm ci

      - name: Contrôles (types + tests du parseur, du WebSocket, de la tournée)
        run: |
          npm run typecheck
          npm test

      - name: SDK Android (plateforme, build-tools, NDK)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk uk-last-mile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uk-last-mile-android-apk
          path: mobile/uk-last-mile.apk
          if-no-files-found: error

      - name: Publier l'APK (lien permanent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: APK Android (dernier build)
          prerelease: true
          body: |
            APK de test, signé avec la clé de debug (ne pas publier tel quel sur le Play Store).
            Installation : ouvrir ce lien sur le téléphone, télécharger `uk-last-mile.apk`, autoriser l'installation d'apps inconnues.
            Au premier lancement, ouvrir Réglages et saisir l'adresse du serveur et la clé.
            Commit : ${{ github.sha }}
          files: mobile/uk-last-mile.apk
